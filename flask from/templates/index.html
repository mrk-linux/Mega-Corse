<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Job Application Form</title>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
</head>

<body>

    <div class="container mt-5">

        <h2 class="mb-4">Job Application Form</h2>

        <form>

            <div class="mb-3">
                <label for="first_name" class="form-label">First Name</label>
                <input type="text" class="form-control" id="first_name" required>
            </div>

            <div class="mb-3">
                <label for="last_name" class="form-label">Last Name</label>
                <input type="text" class="form-control" id="last_name" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required>
            </div>

            <div class="mb-3">
                <label for="date" class="form-label">First Available Date</label>
                <input type="date" class="form-control" id="date" required>
            </div>

            <div class="mb-4">
                <label class="form-label">Current Occupation</label>

                <div class="form-check">
                    <input class="form-check-input" type="radio" name="occupation" id="employed">
                    <label class="form-check-label" for="employed">Employed</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="radio" name="occupation" id="unemployed">
                    <label class="form-check-label" for="unemployed">Unemployed</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="radio" name="occupation" id="self-employed">
                    <label class="form-check-label" for="self-employed">Self-Employed</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="radio" name="occupation" id="student">
                    <label class="form-check-label" for="student">Student</label>
                </div>

            </div>

            <button type="submit" class="btn btn-primary">
                Submit
            </button>

        </form>

    </div>

</body>

</html>
